<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeoVitru" />
    <meta
      name="description"
      content="NEO•VITRU — Evidence-based Solo-Leveling personal fitness, physical skill & Apple Health optimization system."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NEO•VITRU — Personal Performance System</title>

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('neo-vitru-ui-visual-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed === 'obsidian' || parsed === 'matrix-night' || parsed === 'daylight') {
              document.documentElement.setAttribute('data-theme', parsed);
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Single Unified Typeface: Sora (futuristic Solo-Leveling geometry + effortless mobile legibility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
