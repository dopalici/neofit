<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1117" />
    <meta name="description" content="NEO•VITRU — Evidence-based Solo-Leveling personal fitness, physical skill & Apple Health optimization system." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NEO•VITRU — Personal Performance System</title>

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('neo-vitru-ui-visual-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed === 'obsidian' || parsed === 'matrix-night' || parsed === 'daylight') {
              document.documentElement.setAttribute('data-theme', parsed);
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cyber-cyan': '#38bdf8',
              'cyber-pink': '#fb7185',
              'cyber-purple': '#818cf8',
              'cyber-black': '#0b1117',
              'matrix-green': '#34d399',
            }
          }
        }
      }
    </script>

    <!-- Ergonomic Typography: Plus Jakarta Sans / Inter for calm reading + JetBrains Mono for tabular System telemetry -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
